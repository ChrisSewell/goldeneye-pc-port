# The iOS app: a UIKit shell from SDL2 around the game. tools_pc/ios_build.sh
# builds the game (the repo's CMakeLists.txt, as a static library) and SDL2
# first, into build-ios/<sdk>/lib, then runs `xcodegen` here and xcodebuild.
#
# Signing: Config/Signing.xcconfig, with your team and bundle prefix in
# Config/Local.xcconfig (ignored by git). The simulator needs neither.
#
# The app holds the game's code and, once you add it, data from your own ROM:
# build it for your own devices only. Never distribute it.
name: GoldenEye
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_C_LANGUAGE_STANDARD: gnu11
    LIBRARY_SEARCH_PATHS: $(inherited) $(GE_LIB_DIR)
    HEADER_SEARCH_PATHS: $(inherited) $(GE_SDL_INCLUDE)
    OTHER_LDFLAGS: $(inherited) -ObjC -lge007 -lSDL2 -lSDL2main -lc++ -lz
    # The libraries are arm64 only: no Intel simulator.
    ARCHS: arm64
targets:
  GoldenEye:
    type: application
    platform: iOS
    sources:
      - path: App
      # Your ROM data, staged by ios_build.sh only with GE_BUNDLE_DATA=1.
      - path: BundledData
        type: folder
        optional: true
    settings:
      base:
        PRODUCT_NAME: GoldenEye 007
        PRODUCT_BUNDLE_IDENTIFIER: $(GE_BUNDLE_PREFIX).goldeneye
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: App/GoldenEye.entitlements
      properties:
        # The port reserves a 4 GB window of address space at a fixed address
        # for the N64's memory (port/src/port_addr.c).
        com.apple.developer.kernel.extended-virtual-addressing: true
        com.apple.developer.kernel.increased-memory-limit: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: GoldenEye
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # The ROM and its converted files go in Documents/data through the
        # Files app, Finder or devicectl.
        UIApplicationSupportsIndirectInputEvents: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        # iOS 27 requires the scene lifecycle; App/SceneShim.m fits SDL2 to it.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: GESceneDelegate
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        GCSupportsControllerUserInteraction: true
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: CoreGraphics.framework
      - sdk: QuartzCore.framework
      - sdk: OpenGLES.framework
      - sdk: Metal.framework
      - sdk: GameController.framework
      - sdk: CoreHaptics.framework
      - sdk: CoreMotion.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreVideo.framework
      - sdk: CoreBluetooth.framework
